name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ml-python-ci:
    name: ML Pipeline (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint (src, scripts, tests)
        run: ruff check src/ scripts/ tests/

      - name: Verify headless Colab v4 CLI syntax & help
        run: |
          python -m py_compile scripts/train_v4_colab.py scripts/train_v4_benchmark_colab.py
          python scripts/train_v4_colab.py --help

      - name: Run pytest suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -v

  web-ci:
    name: Web App (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (copies self-hosted ORT WASM)
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build
